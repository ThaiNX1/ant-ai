name: Deploy ai-service to EC2

on:
  push:
    branches: [prod]
    paths:
      - 'apps/ai-service/**'
  workflow_dispatch:

concurrency:
  group: deploy-ai-service
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: ant-ai-service
  ECR_REGISTRY: 665602132704.dkr.ecr.ap-southeast-1.amazonaws.com
  DOCKERFILE: apps/ai-service/Dockerfile
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push BE Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "665602132704"

      - name: Build, tag, and push BE image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f "$DOCKERFILE" -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy to EC2 (Prod)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_PROD_SSH_KEY }}
          script: IMAGE_TAG=${{ env.IMAGE_TAG }} /home/ec2-user/ant-ai/deploy-ai-service.sh
